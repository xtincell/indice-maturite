name: Questionnaire et reprise
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --check diagnostic.js && node --check app.js
      - run: node --test tests/diagnostic.test.cjs

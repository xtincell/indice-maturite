name: Questionnaire, reprise et hors ligne
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --check diagnostic.js && node --check app.js && node --check sw.js && node --check tests/recette-navigateur.cjs
      - run: node --test tests/*.test.cjs
